# Railway "config as code" for the API service (set the service's Root Directory to `backend`).
# Secrets/URLs are NOT here - they are Variables in the Railway dashboard. See docs/deployment.md
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No separate migrate service (unlike docker-compose.yml), so apply pending migrations right
# before starting. Safe because we run exactly ONE instance (see docs/adr/0001).
startCommand = "sh -c 'npx prisma migrate deploy && node dist/server.js'"
# A deploy only goes live once /health answers - a bad release never replaces a working one.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
