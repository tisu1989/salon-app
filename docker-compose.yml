services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: salon_app
      MYSQL_USER: salon
      MYSQL_PASSWORD: salonpass
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # One-shot: applies pending migrations, then exits. `api` waits for this to
  # finish successfully before starting - keeps migration-running out of the
  # app's own boot sequence, which matters the moment there's more than one
  # api replica (they'd otherwise race to apply migrations concurrently).
  migrate:
    build:
      context: ./backend
    image: salon-app-backend:local
    env_file:
      - ./backend/.env
    environment:
      # Host-mapped ports (localhost:3308 etc. in backend/.env) don't resolve
      # from inside another container - reach mysql/redis by service name, on
      # their original (non-remapped) ports, over the compose network instead.
      DATABASE_URL: mysql://salon:salonpass@mysql:3306/salon_app
    depends_on:
      mysql:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  api:
    build:
      context: ./backend
    image: salon-app-backend:local
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://salon:salonpass@mysql:3306/salon_app
      REDIS_URL: redis://redis:6379
      PORT: "4000"
    ports:
      - "4002:4000" # host 4000 was already taken by something unrelated on this machine
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
