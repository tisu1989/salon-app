# Render "Blueprint": describes the API service so it can be created from this repo in one click
# (Render dashboard -> New -> Blueprint). Values marked `sync: false` are secrets/URLs you type
# into the dashboard yourself - they never live in git. Step-by-step: docs/deployment.md
services:
  - type: web
    name: salon-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # No separate migrate service here (unlike docker-compose.yml), so apply pending migrations
    # right before starting. Safe because we run exactly ONE instance (see docs/adr/0001).
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/server.js"
    plan: free
    healthCheckPath: /health
    # Only deploy after the GitHub Actions checks pass - CI is the gate, Render is the delivery truck.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY # Render puts one reverse proxy in front of us
        value: "1"
      - key: JWT_ACCESS_SECRET # generated: 256-bit random, satisfies the 32+ char production rule
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS # your Cloudflare Pages URL, e.g. https://salon-app.pages.dev
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
